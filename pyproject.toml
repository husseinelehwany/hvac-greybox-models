[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hvac-greybox"
version = "0.1.0"
description = "Grey-box HVAC models: RC zones, VAV boxes, AHU with economizer, controllers and EPW weather"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
    "scipy>=1.9",
    "matplotlib>=3.5",
    "pandas>=1.4",
]

[project.optional-dependencies]
app = ["streamlit>=1.12"]   # Streamlit GUI and hvac_greybox.gui
dev = ["pytest>=7"]

# Flat layout: only the hvac_greybox package is installed, not app/, scripts/, web/, data/ ...
[tool.setuptools.packages.find]
where = ["."]
include = ["hvac_greybox*"]

# Lets `pytest` (run from the project root) import hvac_greybox without installing it
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
